stages:
  - lint
  - test
  - build
  - build_shadow
  - deploy_shadow
  - deploy_prod
  - verify_and_rollback

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  SHADOW_IMAGE_TAG: "$CI_REGISTRY_IMAGE:shadow-$CI_COMMIT_SHORT_SHA"
  KUBE_NAMESPACE: "ml-service"
  MLFLOW_TRACKING_URI: "http://host.docker.internal:5001"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

lint:
  stage: lint
  image: python:3.9-slim
  script:
    - pip install --no-cache-dir ruff
    - ruff check app.py retrain.py simulate_traffic.py save_baseline.py switch_baseline.py dags/ scripts/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

test:
  stage: test
  image: python:3.9-slim
  script:
    - pip install --no-cache-dir -r requirements-test.txt
    - pytest tests/ -v --tb=short
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"gitlab-ci-token\",\"password\":\"$CI_JOB_TOKEN\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $IMAGE_TAG --insecure --skip-tls-verify
  only:
    - main

build_shadow:
  stage: build_shadow
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip3 install --break-system-packages mlflow pandas scikit-learn xgboost joblib
    - python3 download_model_for_shadow.py
  script:
    - docker build -t $SHADOW_IMAGE_TAG -t $CI_REGISTRY_IMAGE:prod-candidate .
    - docker push $SHADOW_IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE:prod-candidate
  only:
    variables:
      - $SHADOW_DEPLOY == "true"

deploy_shadow:
  stage: deploy_shadow
  image: bitnami/kubectl:latest
  script:
    - sed "s|__CI_REGISTRY_IMAGE__|$CI_REGISTRY_IMAGE|g; s|__CI_COMMIT_SHORT_SHA__|$CI_COMMIT_SHORT_SHA|g" manifests/shadow-deployment.yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -
    - export SHADOW_URL="http://ml-app-shadow:8000"
    - sed "s|__CI_REGISTRY_IMAGE__|$CI_REGISTRY_IMAGE|g; s|__CI_COMMIT_SHORT_SHA__|$CI_COMMIT_SHORT_SHA|g; s|__SHADOW_URL__|$SHADOW_URL|g" manifests/deployment.yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -
  only:
    variables:
      - $SHADOW_DEPLOY == "true"

deploy_prod:
  stage: deploy_prod
  image: bitnami/kubectl:latest
  script:
    - export PROD_IMAGE="$CI_REGISTRY_IMAGE:prod-candidate"
    - sed "s|__CI_REGISTRY_IMAGE__|$CI_REGISTRY_IMAGE|g; s|__CI_COMMIT_SHORT_SHA__|$CI_COMMIT_SHORT_SHA|g; s|__SHADOW_URL__||g" manifests/deployment.yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -
    - kubectl --kubeconfig "$KUBECONFIG" delete deployment ml-app-shadow -n $KUBE_NAMESPACE || true
  only:
    variables:
      - $PROD_DEPLOY == "true"

verify_and_rollback:
  stage: verify_and_rollback
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -sSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
    - chmod +x /usr/local/bin/kubectl
    - pip install --no-cache-dir requests
  script:
    - kubectl --kubeconfig "$KUBECONFIG" -n monitoring port-forward svc/prometheus 9090:9090 &
    - sleep 8
    - export PROMETHEUS_URL="http://localhost:9090"
    - export KUBE_NAMESPACE="ml-service"
    - export APP_NAME="ml-app"
    - export WARMUP_SECONDS="60"
    - python scripts/verify_and_rollback.py
  only:
    variables:
      - $PROD_DEPLOY == "true"
  when: on_success
