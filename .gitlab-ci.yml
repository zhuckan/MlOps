stages:
  - lint
  - test
  - build
  - deploy-shadow
  - deploy-canary-10
  - verify-canary-10
  - promote-canary-50
  - verify-canary-50
  - promote-canary-100

variables:
  CI_SERVER_URL: "http://100.72.228.121:8929"
  KUBE_NAMESPACE: "ml-service"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  KANIKO_IMAGE: "gcr.io/kaniko-project/executor:v1.19.0-debug"
  KUBECTL_IMAGE: "bitnami/kubectl:1.29"

cache:
  paths:
    - .cache/pip

.kaniko: &kaniko
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"gitlab-ci-token\",\"password\":\"$CI_JOB_TOKEN\"}}}" \
        > /kaniko/.docker/config.json

.kubectl: &kubectl
  image: $KUBECTL_IMAGE
  before_script:
    - test -n "$KUBECONFIG" || (echo "KUBECONFIG is not set" && exit 1)

.apply_base: &apply_base
  - kubectl apply -f manifests/namespace.yaml
  - kubectl apply -f manifests/rbac.yaml
  - kubectl apply -f manifests/quota.yaml
  - kubectl apply -f manifests/limitrange.yaml
  - kubectl apply -f manifests/service.yaml
  - kubectl apply -f manifests/istio/gateway.yaml
  - kubectl apply -f manifests/istio/destination-rule.yaml

lint:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install --no-cache-dir ruff
    - ruff check app.py retrain.py simulate_traffic.py save_baseline.py switch_baseline.py dags/ scripts/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

test:
  stage: test
  image: python:3.11-slim
  script:
    - pip install --no-cache-dir -r requirements-test.txt
    - pytest tests/ -v --tb=short
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

build:
  <<: *kaniko
  stage: build
  script:
    - /kaniko/executor
        --context $CI_PROJECT_DIR
        --dockerfile $CI_PROJECT_DIR/Dockerfile
        --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
        --insecure --skip-tls-verify
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-canary:
  <<: *kaniko
  stage: build
  script:
    - /kaniko/executor
        --context $CI_PROJECT_DIR
        --dockerfile $CI_PROJECT_DIR/Dockerfile.shadow
        --destination $CI_REGISTRY_IMAGE:canary-$CI_COMMIT_SHORT_SHA
        --build-arg MLFLOW_TRACKING_URI=$MLFLOW_TRACKING_URI
        --insecure --skip-tls-verify
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-shadow:
  <<: *kubectl
  stage: deploy-shadow
  script:
    - *apply_base
    - sed "s|__CI_REGISTRY_IMAGE__|$CI_REGISTRY_IMAGE|g; s|__CI_COMMIT_SHORT_SHA__|$CI_COMMIT_SHORT_SHA|g"
        manifests/deployment.yaml | kubectl apply -f -
    - sed "s|__CANARY_IMAGE__|$CI_REGISTRY_IMAGE:canary-$CI_COMMIT_SHORT_SHA|g"
        manifests/canary-deployment.yaml | kubectl apply -f -
    - kubectl apply -f manifests/istio/virtual-service-shadow.yaml
    - kubectl -n $KUBE_NAMESPACE rollout status deployment/ml-app --timeout=180s
    - kubectl -n $KUBE_NAMESPACE rollout status deployment/ml-app-canary --timeout=180s
  environment:
    name: shadow
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-canary:
  <<: *kubectl
  stage: deploy-canary-10
  script:
    - *apply_base
    - sed "s|__CI_REGISTRY_IMAGE__|$CI_REGISTRY_IMAGE|g; s|__CI_COMMIT_SHORT_SHA__|$CI_COMMIT_SHORT_SHA|g"
        manifests/deployment.yaml | kubectl apply -f -
    - sed "s|__CANARY_IMAGE__|$CI_REGISTRY_IMAGE:canary-$CI_COMMIT_SHORT_SHA|g"
        manifests/canary-deployment.yaml | kubectl apply -f -
    - sed "s|__STABLE_WEIGHT__|90|g; s|__CANARY_WEIGHT__|10|g"
        manifests/istio/virtual-service-canary.yaml | kubectl apply -f -
    - kubectl -n $KUBE_NAMESPACE rollout status deployment/ml-app-canary --timeout=180s
  environment:
    name: production
    action: start
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false

verify-canary:
  stage: verify-canary-10
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -sSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
    - chmod +x /usr/local/bin/kubectl
    - pip install --no-cache-dir requests
  script:
    - kubectl --kubeconfig "$KUBECONFIG" -n monitoring port-forward svc/prometheus 9090:9090 &
    - sleep 8
    - export PROMETHEUS_URL=http://localhost:9090
    - export ROLLBACK_MODE=canary
    - python scripts/verify_and_rollback.py
  needs: ["deploy-canary"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

promote-canary-50:
  <<: *kubectl
  stage: promote-canary-50
  script:
    - sed "s|__STABLE_WEIGHT__|50|g; s|__CANARY_WEIGHT__|50|g"
        manifests/istio/virtual-service-canary.yaml | kubectl apply -f -
  needs: ["verify-canary"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false

verify-canary-50:
  extends: verify-canary
  stage: verify-canary-50
  needs: ["promote-canary-50"]

promote-canary-100:
  <<: *kubectl
  stage: promote-canary-100
  script:
    - kubectl -n $KUBE_NAMESPACE set image deployment/ml-app api=$CI_REGISTRY_IMAGE:canary-$CI_COMMIT_SHORT_SHA
    - kubectl -n $KUBE_NAMESPACE rollout status deployment/ml-app --timeout=180s
    - sed "s|__STABLE_WEIGHT__|100|g; s|__CANARY_WEIGHT__|0|g"
        manifests/istio/virtual-service-canary.yaml | kubectl apply -f -
    - kubectl -n $KUBE_NAMESPACE delete deployment ml-app-canary --ignore-not-found
  needs: ["verify-canary-50"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false
