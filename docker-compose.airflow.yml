services:
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    entrypoint: /bin/bash -c "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    volumes:
      - airflow_data:/opt/airflow
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      KUBECONFIG: /Users/sophie/.kube/config
      TELEGRAM_BOT_TOKEN: "8903354508:AAF_On6mhmOfGzuz1KW_KFT1rfH3m9zLNNg"
      TELEGRAM_CHAT_ID: "750795068"
      GITLAB_URL: "http://host.docker.internal:8088"
      GITLAB_PROJECT_ID: "1"
      GITLAB_TRIGGER_TOKEN: ""
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ${HOME}/.kube:/Users/sophie/.kube
      - ${HOME}/.minikube:/Users/sophie/.minikube
      - ./feature_repo:/opt/airflow/feature_repo
      - ./mlruns:/opt/airflow/mlruns
      - ./kubeconfig-ci.yaml:/opt/airflow/kubeconfig-ci.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - airflow-init
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      KUBECONFIG: /Users/sophie/.kube/config
      TELEGRAM_BOT_TOKEN: "8903354508:AAF_On6mhmOfGzuz1KW_KFT1rfH3m9zLNNg"
      TELEGRAM_CHAT_ID: "750795068"
      GITLAB_URL: "http://host.docker.internal:8088"
      GITLAB_PROJECT_ID: "1"
      GITLAB_TRIGGER_TOKEN: ""
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ${HOME}/.kube:/Users/sophie/.kube
      - ${HOME}/.minikube:/Users/sophie/.minikube
      - ./feature_repo:/opt/airflow/feature_repo
      - ./mlruns:/opt/airflow/mlruns
      - ./kubeconfig-ci.yaml:/opt/airflow/kubeconfig-ci.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - airflow-init
    restart: unless-stopped

volumes:
  airflow_data: