services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./mlruns:/app/mlruns
    command: ["--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    depends_on:
      - mlflow
      - minio

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5001:5000"
    environment:
      - MLFLOW_ALLOW_FILE_STORE=true
      - MLFLOW_ALLOW_ORIGIN=*
      - MLFLOW_ALLOW_HOST=*
    volumes:
      - ./mlruns:/mlruns
    command: mlflow ui --backend-store-uri file:/mlruns --host 0.0.0.0 --allowed-hosts '*'
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped