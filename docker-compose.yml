services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5001:5000"
    environment:
      - MLFLOW_ALLOW_FILE_STORE=true
      - MLFLOW_ALLOW_ORIGIN=*
      - MLFLOW_ALLOW_HOST=*
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --backend-store-uri file:/mlruns
      --artifacts-destination /mlruns
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts '*'
    restart: unless-stopped