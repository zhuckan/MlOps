apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-app
  namespace: ml-service
  labels:
    app: ml-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-app
  template:
    metadata:
      labels:
        app: ml-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ml-app
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: api
          image: __CI_REGISTRY_IMAGE__:__CI_COMMIT_SHORT_SHA__
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: SHADOW_URL
              value: "__SHADOW_URL__"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /status
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /status
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
