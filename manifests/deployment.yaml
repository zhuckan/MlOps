apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-app
  namespace: ml-service
  labels:
    app: ml-app
    version: stable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-app
      version: stable
  template:
    metadata:
      labels:
        app: ml-app
        version: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ml-app
      containers:
        - name: api
          image: __CI_REGISTRY_IMAGE__:__CI_COMMIT_SHORT_SHA__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://host.minikube.internal:5001"
            - name: MODEL_URI
              value: "models:/creditcard_fraud_model@champion"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet: { path: /status, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /status, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5