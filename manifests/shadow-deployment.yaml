apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-app-shadow
  namespace: ml-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-app-shadow
  template:
    metadata:
      labels:
        app: ml-app-shadow
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: ml-app
      containers:
      - name: api
        image: __CI_REGISTRY_IMAGE__:shadow-__CI_COMMIT_SHORT_SHA__
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: SHADOW_URL
          value: ""
---
apiVersion: v1
kind: Service
metadata:
  name: ml-app-shadow
  namespace: ml-service
spec:
  selector:
    app: ml-app-shadow
  ports:
  - port: 8000
    targetPort: 8000